[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor-v3"
version = "3.0.0"
description = "美股正股与加密货币现货异动监控（Telegram / Discord 推送，网页管理后台）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=13,<18",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
longbridge = ["longbridge>=5.5,<6"]
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9,<3",
    "tomlkit>=0.12,<1",
    "segno>=1.6,<2",
]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
monitor = "market_monitor_v3.cli:main"

[tool.setuptools.packages.find]
include = ["market_monitor_v3*"]

[tool.setuptools.package-data]
"market_monitor_v3.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 130
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741", "E501", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["market_monitor_v3", "tests"]
