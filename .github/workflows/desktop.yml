# 桌面版（Tauri）：检查、单元测试，并在 macOS 和 Windows 上打安装包。
# - 推到 main 或改动 desktop/ 的 PR：打包后作为 Actions 构件（Artifacts）下载
# - 推 desktop-v* 标签（例如 desktop-v0.4.0）：另外建一个草稿 Release，附上安装包
name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            name: windows-x64
            args: ""
            bundle: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: trafast-desktop-${{ matrix.name }}
          path: |
            desktop/${{ matrix.bundle }}/dmg/*.dmg
            desktop/${{ matrix.bundle }}/nsis/*.exe
            desktop/${{ matrix.bundle }}/msi/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Trafast 桌面版 ${{ github.ref_name }}
          files: dist/*
