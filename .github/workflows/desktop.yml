# 桌面版（Tauri）：检查、单元测试，并在 macOS 和 Windows 上打安装包。
# - 推到 main 或改动 desktop/ 的 PR：打包后作为 Actions 构件（Artifacts）下载
# - 推 v* 标签（例如 v4.0.0），或手动运行时填 release_tag：发正式 Release，
#   附上桌面版安装包、服务器后端源码包和 SHA256 校验和；说明取自 .github/release-notes/<标签>.md
name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本标签（例如 v4.0.0，留空只打包不发布）；标签不存在时在当前提交上新建"
        required: false
        default: ""

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            name: windows-x64
            args: ""
            bundle: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: trafast-desktop-${{ matrix.name }}
          path: |
            desktop/${{ matrix.bundle }}/dmg/*.dmg
            desktop/${{ matrix.bundle }}/nsis/*.exe
            desktop/${{ matrix.bundle }}/msi/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 服务器后端源码包、校验和
        run: |
          # 构件里安装包在 dmg/、nsis/、msi/ 子目录下：全部拿出来平铺到 dist/
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp -t dist {} +
          ls dist | grep -q '\.dmg$' || { echo "没有找到 Mac 安装包"; exit 1; }
          ls dist | grep -q '\.exe$' || { echo "没有找到 Windows 安装包"; exit 1; }
          name="trafast-server-${TAG}"
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" HEAD -- . ':!desktop' ':!.github'
          git archive --format=zip --prefix="${name}/" -o "dist/${name}.zip" HEAD -- . ':!desktop' ':!.github'
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          notes="../.github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then cp "$notes" ../release-notes.md; else echo "Trafast ${TAG}" > ../release-notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Trafast ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*
