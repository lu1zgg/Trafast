[package]
name = "trafast-desktop"
version = "0.4.0"
description = "Trafast 异动监控桌面版"
edition = "2021"
rust-version = "1.77"

[lib]
name = "trafast_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.3"
tauri-plugin-single-instance = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
